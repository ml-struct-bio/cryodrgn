[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cryodrgn"
dynamic = ["version"]
authors = [
  { name="Ellen Zhong", email="zhonge@princeton.edu" }
]
description = "cryoDRGN heterogeneous reconstruction"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "scikit-learn",
    "torch>=2",
    "numpy>=1.25",
    "scipy>=1.3.1",
    "pandas>=2.2",
    "healpy",
    "umap-learn",
    "igraph",
    "starfile",
    "pyyaml",
    "matplotlib>=3.7",
    "seaborn>=0.12.2",
    "flask>=3.0.0",
    "jupyterlab>=4",
    "notebook>=6",
    "ipywidgets>=8",
    "plotly>=5,<7",
    "anywidget",
]

[project.optional-dependencies]
dev = [
    "build",
    "myst-parser",
    "playwright>=1.40",
    "pre-commit",
    "pyright==1.1.300",
    "pytest>=6",
    "pytest-xdist",
    "twine",
]

[project.scripts]
cryodrgn = "cryodrgn.command_line:main_commands"
cryodrgn_utils = "cryodrgn.command_line:util_commands"

[project.urls]
"Homepage" = "https://github.com/zhonge/cryodrgn"

[tool.setuptools_scm]
write_to = "cryodrgn/_version.py"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"cryodrgn.dashboard" = [
    "templates/*.html",
    "static/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cryodrgn*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rA"
# Prefer the checkout on ``sys.path`` over any older ``cryodrgn`` installed in the env
# (otherwise dashboard tests exercise site-packages, not the working tree).
pythonpath = ["."]
testpaths = [
    "tests"
]
markers = [
    "browser: needs Playwright and Chromium (``playwright install chromium``)",
    "jsunit: dashboard JS module test; needs Chromium but no server, fixture, or WebGL",
    "webgl: asserts the headless browser's WebGL stack itself (see CRYODRGN_REQUIRE_WEBGL)",
    "slow: typically more than 10s wall time",
    "dashboard: cryodrgn dashboard test module",
]

[tool.pyright]
exclude = ["build/**"]
