name: CI Testing

on:
  push:
    branches: [ develop ]
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'
      - '[0-9]+\.[0-9]+\.[0-9]+-*'
  pull_request:
    branches: [ main ]

jobs:
  run_tests:

    runs-on: ${{ matrix.os }}
    # Stabilize MKL / OpenMP when pytest-xdist runs multiple workers importing PyTorch.
    # Without this, CI can intermittently hit: "Intel MKL FATAL ERROR: Cannot load ... libtorch_cpu.so".
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MKL_THREADING_LAYER: GNU
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    strategy:
      matrix:
        python: [ '3.10', '3.11' , '3.12' , '3.13' , '3.14' ]
        os: [ macos-latest, ubuntu-latest ]
        include:
          # Each row targets a distinct compatibility corner (floor, NumPy 1.x,
          # NumPy 2.0 ABI, first 3.13 wheels, bleeding-edge 3.14 + latest torch).
          - python: '3.10'
            torch: '2.0.1'
            numpy: '1.25.2'
          - python: '3.11'
            torch: '2.1.2'
            numpy: '1.26.4'
          - python: '3.12'
            torch: '2.4.1'
            numpy: '2.0.2'
          - python: '3.13'
            torch: '2.6.0'
            numpy: '2.1.3'
          - python: '3.14'
            torch: '2.12.1'
            numpy: '2.4.6'
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install cryoDRGN with pytest dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --force-reinstall --no-cache-dir \
            "numpy==${{ matrix.numpy }}" "torch==${{ matrix.torch }}"
          # Keep numpy pinned when resolving cryoDRGN deps (pandas etc. may upgrade it).
          echo "numpy==${{ matrix.numpy }}" > "${{ runner.temp }}/numpy-constraint.txt"
          python3 -m pip install --no-cache-dir ".[dev]" \
            -c "${{ runner.temp }}/numpy-constraint.txt"
          python -m playwright install chromium

      - name: Pytest
        run: |
          pytest -v -n2 --dist=loadscope --show-capture=stderr
